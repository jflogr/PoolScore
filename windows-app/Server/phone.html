<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pool Score</title>
<style>
  :root {
    --ink: #2b3846;
    --deep: #223040;
    --paper: #ffffff;
    --muted: #93a3b5;
    --line: #35465a;
    --gold: #d9a441;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--deep);
    color: var(--paper);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header { padding: 14px 16px 10px; }
  h1 { margin: 0; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .pace { margin: 4px 0 0; font-size: 0.82rem; color: var(--muted); }
  .pace:empty { display: none; }

  /* a tap turned away because somebody had just scored that rack */
  .notice { margin: 0; padding: 10px 16px; background: #fbf0d9; color: var(--deep); font-weight: 600; font-size: 0.92rem; }

  /* ---- two columns: side A on the left, side B on the right ---- */
  .cols { display: grid; grid-template-columns: 1fr 1fr; }
  .cols > .col + .col { border-left: 1px solid var(--line); }
  .col { min-width: 0; }

  /* ---- the score itself, the reason anyone opens this ---- */
  .score { background: var(--ink); }
  .score .col { padding: 16px 14px 18px; display: flex; flex-direction: column; align-items: center; text-align: center; }

  .names { max-width: 100%; display: flex; align-items: center; gap: 6px; font-size: 1.2rem; font-weight: 700; line-height: 1.15; }
  .names .stack { min-width: 0; }
  .names span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .tally { margin: 6px 0 10px; font-size: 3.6rem; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .lit .tally, .lit .names { color: var(--gold); }

  .dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--gold); flex: none; }
  .dot.off { visibility: hidden; }

  /* one box per rack in that side's race, filling as they are won */
  .bar { display: flex; gap: 3px; margin-top: 8px; width: 100%; }
  .bar i { flex: 1; height: 7px; border-radius: 2px; background: #3d4c5c; }
  .bar i.won { background: var(--paper); }
  .lit .bar i.won { background: var(--gold); }

  /* ---- reference below ---- */
  section { padding: 16px; border-top: 1px solid var(--line); }
  h2 { margin: 0 0 10px; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  th { text-align: left; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-bottom: 6px; }
  td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  tr.current td { background: #2f3f52; }
  tr.played td { color: var(--muted); }
  .set { color: var(--muted); font-variant-numeric: tabular-nums; padding-right: 10px; }
  .took { color: var(--muted); font-size: 0.8rem; }
  .vs { color: var(--muted); font-size: 0.85rem; }
  .sitting { color: var(--muted); font-size: 0.82rem; }

  /* ---- plus / minus, side by side under the score ---- */
  .pm { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .pm button {
    height: 52px; border-radius: 12px; padding: 0;
    border: 1px solid var(--line); background: var(--deep); color: var(--paper);
    font: 700 1.6rem/1 system-ui, sans-serif;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .pm button.plus { background: #3a4c61; border-color: #4a5e75; }
  .pm button:active:not(:disabled) { transform: scale(0.96); background: var(--gold); color: var(--deep); }
  .pm button:disabled { opacity: 0.3; }
  .viewonly .pm { display: none; }

  /* ---- asking to score ---- */
  .access { padding: 12px 16px 14px; background: var(--ink); border-top: 1px solid var(--line); }
  .access form { display: flex; gap: 8px; margin: 0; }
  .access form[hidden] { display: none; }
  .access input {
    flex: 1; min-width: 0; height: 44px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--deep); color: var(--paper); font: inherit;
  }
  .access input::placeholder { color: var(--muted); }
  .access button {
    height: 44px; padding: 0 16px; border-radius: 10px; border: 0; flex: none;
    background: var(--gold); color: var(--deep); font: 700 1rem system-ui, sans-serif;
    touch-action: manipulation;
  }
  .access button:disabled { opacity: 0.4; }
  .access p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .access form + p:not(:empty) { margin-top: 8px; }
  .access p.good { color: var(--paper); }

  /* ---- match setup: one-off matches, allowed phones only ----
     The same two columns as the score, with a header over each control. */
  .setup h2 + .cols { margin-bottom: 18px; }
  .setup .col { display: flex; flex-direction: column; gap: 6px; padding: 0 14px; }
  .setup .col:first-child { padding-left: 0; }
  .setup .col:last-child { padding-right: 0; }
  .field-label { color: var(--muted); font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stepper { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; }
  .stepper output { text-align: center; font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .setup button, .setup select {
    height: 44px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--ink); color: var(--paper); font: inherit;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .stepper button { padding: 0; font: 700 1.4rem/1 system-ui, sans-serif; }
  .setup button:disabled { opacity: 0.3; }
  .setup button:active:not(:disabled) { background: var(--gold); color: var(--deep); }
  .setup select { width: 100%; padding: 0 10px; }
  .setup .hint { margin: -8px 0 16px; color: var(--muted); font-size: 0.82rem; }
  .setup .clear { width: 100%; font-weight: 700; border-color: #6b5530; color: var(--gold); }

  footer { padding: 14px 16px 24px; color: var(--muted); font-size: 0.78rem; }
  .offline { color: var(--gold); }
</style>
</head>
<body>
  <header><h1 id="heading">Connecting…</h1><p class="pace" id="pace"></p></header>

  <div class="score cols viewonly" id="score">
    <div class="col" id="homeSide">
      <div class="names"><span class="dot off" id="homeDot"></span><div class="stack" id="homeNames"></div></div>
      <div class="bar" id="homeBar"></div>
      <div class="tally" id="homeScore">0</div>
      <div class="pm">
        <button type="button" id="homeMinus" aria-label="Take a rack off">&minus;</button>
        <button type="button" class="plus" id="homePlus" aria-label="Add a rack">+</button>
      </div>
    </div>
    <div class="col" id="awaySide">
      <div class="names"><span class="dot off" id="awayDot"></span><div class="stack" id="awayNames"></div></div>
      <div class="bar" id="awayBar"></div>
      <div class="tally" id="awayScore">0</div>
      <div class="pm">
        <button type="button" id="awayMinus" aria-label="Take a rack off">&minus;</button>
        <button type="button" class="plus" id="awayPlus" aria-label="Add a rack">+</button>
      </div>
    </div>
  </div>

  <p class="notice" id="notice" hidden></p>

  <div class="access">
    <form id="askForm">
      <input id="askName" maxlength="24" autocomplete="nickname" placeholder="Your name" aria-label="Your name">
      <button type="submit" id="askButton" disabled>Ask to score</button>
    </form>
    <p id="accessNote"></p>
  </div>

  <section id="setupSection" class="setup" hidden>
    <h2>Race</h2>
    <div class="cols">
      <div class="col">
        <div class="field-label" id="homeRaceLabel">Home races to</div>
        <div class="stepper">
          <button type="button" id="homeRaceDown" aria-label="Shorter race">&minus;</button>
          <output id="homeRace">3</output>
          <button type="button" id="homeRaceUp" aria-label="Longer race">+</button>
        </div>
      </div>
      <div class="col">
        <div class="field-label" id="awayRaceLabel">Away races to</div>
        <div class="stepper">
          <button type="button" id="awayRaceDown" aria-label="Shorter race">&minus;</button>
          <output id="awayRace">3</output>
          <button type="button" id="awayRaceUp" aria-label="Longer race">+</button>
        </div>
      </div>
    </div>

    <h2>Players</h2>
    <div class="cols">
      <div class="col" id="homePicks"></div>
      <div class="col" id="awayPicks"></div>
    </div>
    <p class="hint">Changing a player starts the score again from 0 - 0.</p>

    <button type="button" class="clear" id="clearScores">Clear scores</button>
  </section>

  <section id="leaderSection" hidden>
    <h2>Player stats</h2>
    <table>
      <thead><tr><th>Player</th><th class="num">Wins</th><th class="num" id="possibleHead">Possible</th><th class="num">Games</th></tr></thead>
      <tbody id="leaders"></tbody>
    </table>
  </section>

  <section id="historySection" hidden>
    <h2>History</h2>
    <table><tbody id="history"></tbody></table>
  </section>

  <section id="upcomingSection" hidden>
    <h2>Matches</h2>
    <table><tbody id="upcoming"></tbody></table>
  </section>

  <footer id="status">Watching live.</footer>

<script>
  "use strict";

  const $ = (id) => document.getElementById(id);

  function names(into, list) {
    into.textContent = "";
    for (const name of list) {
      const line = document.createElement("span");
      line.textContent = name;
      into.append(line);
    }
  }

  // One box per rack in the race. With a handicap the two sides have different
  // counts, so what you compare is how full each bar is, not how many boxes.
  function bar(into, score, target) {
    into.textContent = "";
    for (let i = 0; i < target; i += 1) {
      const box = document.createElement("i");
      if (i < score) box.className = "won";
      into.append(box);
    }
  }

  let game = "-";
  let canScore = false;

  // ---- who this phone is ------------------------------------------------
  // A random key made here and kept in this browser. Asking to score sends
  // it to the PC; once allowed there, taps carrying it count. getRandomValues
  // rather than randomUUID, which browsers only offer on https.
  function makeKey() {
    const bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
  }

  const store = {
    get(name) { try { return localStorage.getItem(name); } catch { return null; } },
    set(name, value) { try { localStorage.setItem(name, value); } catch { /* private mode */ } }
  };

  let key = store.get("poolscore-key");
  if (!/^[0-9a-f]{32}$/.test(key || "")) {
    key = makeKey();
    store.set("poolscore-key", key);
  }

  $("askName").value = store.get("poolscore-name") || "";

  // The PC needs a name to know who is asking, so no name, no asking.
  function nameGiven() { return $("askName").value.trim() !== ""; }
  function syncAskButton() { $("askButton").disabled = !nameGiven(); }
  $("askName").addEventListener("input", syncAskButton);
  syncAskButton();

  // none, pending, approved - what the PC says - plus denied, revoked and
  // busy, which are only ever news and settle back to asking again.
  let access = "none";
  let poll = 0;

  const notes = {
    none: "",
    pending: "Waiting for the scorer to allow this phone\u2026",
    approved: "This phone can score.",
    denied: "The scorer said no.",
    revoked: "Scoring was turned off for this phone.",
    busy: "Too many phones are waiting \u2014 try again in a moment."
  };

  function setAccess(status) {
    // After a no, the PC just forgets the phone, so its next word is "none".
    // Keep the news on screen rather than wiping it straight away.
    if (status === "none" && (access === "denied" || access === "revoked" || access === "busy")) return;
    if (!(status in notes)) return;

    access = status;
    $("askForm").hidden = status === "pending" || status === "approved";
    $("accessNote").textContent = notes[status];
    $("accessNote").classList.toggle("good", status === "approved");
    showButtons();

    // The answer normally arrives on the event stream. Checking now and then
    // while waiting covers an answer lost to a dropped connection.
    clearInterval(poll);
    if (status === "pending") poll = setInterval(checkAccess, 4000);
  }

  function checkAccess() {
    fetch("api/access?key=" + key, { cache: "no-store" })
      .then((response) => response.json())
      .then((answer) => setAccess(answer.status))
      .catch(() => {});
  }

  function showButtons() {
    const live = access === "approved" && canScore;
    $("score").classList.toggle("viewonly", !live);
    $("setupSection").hidden = !(access === "approved" && setup);
  }

  $("askForm").addEventListener("submit", (event) => {
    event.preventDefault();
    if (!nameGiven()) return; // Enter on the keyboard skips the disabled button
    const name = $("askName").value.trim();
    store.set("poolscore-name", name);
    access = "none"; // asking again clears any earlier no

    fetch("api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key, name })
    })
      .then((response) => { if (!response.ok) throw new Error(); return response.json(); })
      .then((answer) => setAccess(answer.status))
      .catch(() => {
        $("accessNote").textContent = "Could not reach the scorer.";
      });
  });

  function side(prefix, list, score, target, breaking) {
    const won = score >= target;
    const onHill = !won && score === target - 1;

    names($(prefix + "Names"), list);
    $(prefix + "Score").textContent = score;
    bar($(prefix + "Bar"), score, target);
    $(prefix + "Dot").classList.toggle("off", !breaking);
    $(prefix + "Side").classList.toggle("lit", onHill || won);
    $(prefix + "Minus").disabled = !canScore || score <= 0;
    $(prefix + "Plus").disabled = !canScore || score >= target;
  }

  // Send the game the tap was aimed at, so a tap that lands after the set has
  // moved on is dropped rather than scored into the next one. The new score
  // comes back on the event stream like any other change.
  function send(path, body) {
    fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key, game, ...body })
    })
      .then((response) => {
        // Taken away at the PC, or the app was restarted and forgot us.
        if (response.status === 403) { setAccess("revoked"); return; }
        if (!response.ok) throw new Error();
      })
      .catch(() => {
        $("status").textContent = "That did not reach the scorer.";
        $("status").classList.add("offline");
      });
  }

  // Shown for a few seconds, then gone - it is news, not a state.
  let noticeTimer = 0;
  function notice(message) {
    $("notice").textContent = message;
    $("notice").hidden = false;
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(() => { $("notice").hidden = true; }, 4000);
  }

  function tap(sideName, delta) {
    if (!canScore || access !== "approved") return;
    send("api/tap", { side: sideName, delta });
  }

  // ---- match setup ------------------------------------------------------
  // Singles and doubles only: the race, who is playing and clearing the
  // score. A round robin sends no setup, so none of this shows.
  let setup = null;
  let slotsShape = "";

  function change(body) {
    if (!setup || access !== "approved") return;
    send("api/setup", body);
  }

  function race(sideName, delta) {
    const now = sideName === "home" ? setup.homeTarget : setup.awayTarget;
    const next = now + delta;
    if (next < setup.minTarget || next > setup.maxTarget) return;
    change({ change: "race", side: sideName, value: next });
  }

  $("homeRaceDown").addEventListener("click", () => race("home", -1));
  $("homeRaceUp").addEventListener("click", () => race("home", 1));
  $("awayRaceDown").addEventListener("click", () => race("away", -1));
  $("awayRaceUp").addEventListener("click", () => race("away", 1));

  $("clearScores").addEventListener("click", () => {
    if (confirm("Clear the scores back to 0 - 0?\n\nThe players and the race are kept.")) {
      change({ change: "clear" });
    }
  });

  function renderSetup(state) {
    setup = state.setup || null;
    showButtons();
    if (!setup) return;

    const races = (list) => list.join(" & ") + (list.length > 1 ? " race to" : " races to");
    const s = state.score;
    $("homeRaceLabel").textContent = races(s.home);
    $("awayRaceLabel").textContent = races(s.away);

    for (const [prefix, target] of [["home", setup.homeTarget], ["away", setup.awayTarget]]) {
      $(prefix + "Race").textContent = target;
      $(prefix + "RaceDown").disabled = target <= setup.minTarget;
      $(prefix + "RaceUp").disabled = target >= setup.maxTarget;
    }

    // Only rebuild the pickers when the slots or the roster change, so a
    // score coming in does not close a list someone has open.
    const shape = JSON.stringify([setup.slots.map((slot) => slot.label), setup.players]);
    if (shape !== slotsShape) {
      slotsShape = shape;

      // The first half of the slots is side A, the second half side B, each
      // under one header: "Player A" in singles, "Team A" in doubles.
      const half = setup.slots.length / 2;
      for (const [prefix, from] of [["home", 0], ["away", half]]) {
        const column = $(prefix + "Picks");
        column.textContent = "";

        const header = document.createElement("div");
        header.className = "field-label";
        header.textContent = setup.slots[from].label.replace(/\s*\(\d+\)$/, "");
        column.append(header);

        for (let index = from; index < from + half; index += 1) {
          const pick = document.createElement("select");
          pick.dataset.slot = index;
          pick.setAttribute("aria-label", setup.slots[index].label);
          pick.append(new Option("\u2014", ""));
          for (const player of setup.players) pick.append(new Option(player.name, player.id));

          // Picking someone already playing swaps the two, at the PC.
          pick.addEventListener("change", () => {
            change({ change: "slot", value: index, player: pick.value || null });
          });

          column.append(pick);
        }
      }
    }

    for (const pick of $("setupSection").querySelectorAll("select")) {
      pick.value = setup.slots[pick.dataset.slot].player || "";
    }
  }

  $("homeMinus").addEventListener("click", () => tap("home", -1));
  $("homePlus").addEventListener("click", () => tap("home", 1));
  $("awayMinus").addEventListener("click", () => tap("away", -1));
  $("awayPlus").addEventListener("click", () => tap("away", 1));

  function render(state) {
    $("heading").textContent = state.heading;
    $("pace").textContent = state.pace || "";

    game = state.game || "-";
    canScore = !!state.canScore;
    showButtons();

    const s = state.score;
    side("home", s.home, s.homeScore, s.homeTarget, s.breaking === "home");
    side("away", s.away, s.awayScore, s.awayTarget, s.breaking === "away");

    renderSetup(state);

    // Singles and doubles have no schedule left to play, so no Possible.
    const leaders = $("leaders");
    const possible = state.leaders.some((row) => row.possible !== null);
    $("possibleHead").hidden = !possible;
    leaders.textContent = "";
    for (const row of state.leaders) {
      const tr = document.createElement("tr");
      tr.innerHTML = "<td></td><td class='num'></td><td class='num'></td><td class='num'></td>";
      tr.children[0].textContent = row.name;
      tr.children[1].textContent = row.wins + "/" + row.played;
      tr.children[2].textContent = row.possible;
      tr.children[2].hidden = !possible;
      tr.children[3].textContent = row.racksWon + "-" + row.racksLost;
      leaders.append(tr);
    }
    $("leaderSection").hidden = state.leaders.length === 0;

    const history = $("history");
    history.textContent = "";
    for (const played of state.history || []) {
      const tr = document.createElement("tr");

      const number = document.createElement("td");
      number.className = "set";
      number.textContent = played.number;

      const who = document.createElement("td");
      const home = document.createElement("div");
      home.textContent = (played.winner === "home" ? "• " : "") + played.home;
      const vs = document.createElement("div");
      vs.className = "vs";
      vs.textContent = "v";
      const away = document.createElement("div");
      away.textContent = (played.winner === "away" ? "• " : "") + played.away;
      who.append(home, vs, away);

      const result = document.createElement("td");
      result.className = "num";
      result.textContent = played.score;
      const took = document.createElement("div");
      took.className = "took";
      took.textContent = (played.time ? played.time + " · " : "") + played.finished;
      result.append(took);

      tr.append(number, who, result);
      history.append(tr);
    }
    $("historySection").hidden = !(state.history && state.history.length);

    const upcoming = $("upcoming");
    upcoming.textContent = "";
    for (const match of state.upcoming) {
      const tr = document.createElement("tr");
      tr.className = match.status;

      const set = document.createElement("td");
      set.className = "set";
      set.textContent = match.set;

      const who = document.createElement("td");
      const home = document.createElement("div");
      home.textContent = (match.breaksFirst === "home" ? "• " : "") + match.home;
      const vs = document.createElement("div");
      vs.className = "vs";
      vs.textContent = "v";
      const away = document.createElement("div");
      away.textContent = (match.breaksFirst === "away" ? "• " : "") + match.away;
      who.append(home, vs, away);

      if (match.sitting) {
        const sitting = document.createElement("div");
        sitting.className = "sitting";
        sitting.textContent = "sitting: " + match.sitting;
        who.append(sitting);
      }

      const result = document.createElement("td");
      result.className = "num";
      result.textContent = match.score || (match.status === "current" ? "now" : "");
      if (match.time) {
        const took = document.createElement("div");
        took.className = "took";
        took.textContent = match.time;
        result.append(took);
      }

      tr.append(set, who, result);
      upcoming.append(tr);
    }
    $("upcomingSection").hidden = state.upcoming.length === 0;
  }

  // ---- staying live -----------------------------------------------------
  // Scores are pushed the moment they change - there is no timer. What goes
  // wrong on phones is the connection dying without a word: the screen locks,
  // the browser is sent to the background, or the phone hops between wifi and
  // mobile data. The page is then left showing an old score with nothing to
  // say it is stale. So the server pings every 15 seconds, and if this page
  // hears nothing for 40 it opens a fresh connection. Coming back to the page
  // always reconnects, which brings the current score straight away.
  const Silence = 40000;
  let source = null;
  let lastHeard = 0;

  function heard() {
    lastHeard = Date.now();
    $("status").textContent = "Watching live.";
    $("status").classList.remove("offline");
  }

  function connect() {
    if (source) source.close();
    lastHeard = Date.now();

    source = new EventSource("api/events?key=" + key);

    source.addEventListener("open", heard);
    source.addEventListener("ping", heard);

    source.addEventListener("access", (event) => {
      heard();
      setAccess(JSON.parse(event.data).status);
    });

    source.addEventListener("notice", (event) => {
      heard();
      notice(JSON.parse(event.data).message);
    });

    source.addEventListener("state", (event) => {
      heard();
      render(JSON.parse(event.data));
    });

    // EventSource retries on its own; just say so while it is down.
    source.addEventListener("error", () => {
      $("status").textContent = "Lost the scorer \u2014 reconnecting\u2026";
      $("status").classList.add("offline");
    });
  }

  setInterval(() => {
    if (document.visibilityState === "visible" && Date.now() - lastHeard > Silence) connect();
  }, 5000);

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") connect();
  });

  // Back from another app via the browser's back/forward cache, or back online.
  window.addEventListener("pageshow", (event) => { if (event.persisted) connect(); });
  window.addEventListener("online", connect);

  connect();
</script>
</body>
</html>
